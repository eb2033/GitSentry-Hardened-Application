name: ci

on:
  push:
    branches: [main, "scenario/**"]
  pull_request:
    branches: [main]

permissions: {}

env:
  REGISTRY: ghcr.io
  # TODO: placeholders - fill in
  INFRA_OWNER: OWNER
  INFRA_REPO_NAME: INFRA_REPO
  FRONTEND_MANIFEST: path/to/frontend/kustomization.yaml
  BACKEND_MANIFEST: path/to/backend/kustomization.yaml
  FRONTEND_YQ_PATH: .images[0].newName
  BACKEND_YQ_PATH: .images[0].newName
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          V=8.24.2
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o gl.sum "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" gl.sum | sed 's/ .*/  gl.tgz/' | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    needs: [gitleaks, zizmor, sonarqube]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [frontend, backend]
    outputs:
      frontend_digest: ${{ steps.out.outputs.frontend }}
      backend_digest: ${{ steps.out.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute image name
        env:
          REPO: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "IMAGE=${REGISTRY}/${REPO,,}-${SERVICE}" >> "$GITHUB_ENV"
      - name: Build image (local only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      # Trivy is installed as a pinned, checksum-verified release binary instead of
      # aquasecurity/trivy-action, because of the 2026 trivy-action compromise.
      - name: Install Trivy (pinned binary, checksum verified)
        run: |
          set -euo pipefail
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${f}"
          echo "${TRIVY_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" trivy
      - name: Trivy scan (fail on secrets and HIGH/CRITICAL vulns)
        run: |
          ./trivy image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 \
            "${IMAGE}:${GITHUB_SHA}"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Export digest
        id: out
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: echo "${SERVICE}=${DIGEST}" >> "$GITHUB_OUTPUT"

  bump-infra:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ env.INFRA_OWNER }}
          repositories: ${{ env.INFRA_REPO_NAME }}
          # Least privilege: only what is needed to push the image bump.
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.INFRA_OWNER }}/${{ env.INFRA_REPO_NAME }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # needed to push with the app token; token is short-lived
      - name: Update image references to digests
        env:
          REPO: ${{ github.repository }}
          FRONTEND_DIGEST: ${{ needs.build.outputs.frontend_digest }}
          BACKEND_DIGEST: ${{ needs.build.outputs.backend_digest }}
        run: |
          set -euo pipefail
          lower="${REPO,,}"
          yq -i "${FRONTEND_YQ_PATH} = \"ghcr.io/${lower}-frontend@${FRONTEND_DIGEST}\"" "${FRONTEND_MANIFEST}"
          yq -i "${BACKEND_YQ_PATH} = \"ghcr.io/${lower}-backend@${BACKEND_DIGEST}\"" "${BACKEND_MANIFEST}"
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "gitsentry-ci[bot]"
          git config user.email "gitsentry-ci[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "ci: bump images to ${GITHUB_SHA::7}"
          git push
